name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: "0.165.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css:prod

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      # Hugo renders public/cv/resume.tex from content/ (layouts/cv/section.resume.tex)
      # Non-blocking: if LaTeX fails, the site still deploys with the committed static/docs/Resume.pdf
      - name: Compile resume PDF
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          working_directory: public/cv
          latexmk_use_lualatex: true

      - name: Publish resume PDF
        run: |
          if [ -f public/cv/resume.pdf ]; then
            cp public/cv/resume.pdf public/docs/Resume.pdf
          else
            echo "::warning::Resume compile failed; keeping the committed Resume.pdf"
          fi
          rm -f public/cv/resume.*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
