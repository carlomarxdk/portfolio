<article class="card">
  <div class="card-date">
    <p>{{ .Params.date.Format "2006" }}</p>
  </div>
  <div class="card-content">
    <h3 class="card-title">
      {{ if .Params.course_url }}
        <a href="{{ .Params.course_url }}" target="_blank" rel="noopener" class="a-hov">{{ .Title }}</a>
      {{ else }}
        {{ .Title }}
      {{ end }}
    </h3>
    <p class="card-subtitle">{{ .Params.role }}</p>
  </div>
</article>
