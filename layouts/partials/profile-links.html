<div id="social" class="flex flex-wrap justify-center gap-1.5 my-2">
  {{ if eq .Site.Params.iconFont "default" }}
    {{ range $key, $val := .Site.Params.Social }}
    <a
      href="{{ $val }}"
      aria-label="Visit {{ $key }} profile"
      target="_blank"
      rel="noopener"
      class="social-pill"
    >{{ $key | title }}</a>
    {{ end }}
  {{ end }}
</div>
