
<section>
  <div class="container max-w-3xl">
      <h2 class="section-heading">Posts</h2>

  {{ $pages := .Pages.ByDate.Reverse }}
  {{ if eq (len $pages) 0 }}
    <p class="font-cabin text-sm italic text-stone-400">No blog posts yet. Stay tuned!</p>
  {{ else }}
    {{ range $pages }}
      {{ if ne .Params.hidden true }}
        {{ partial "elements/blog-card.html" . }}
      {{ end }}
    {{ end }}
  {{ end }}
  </div>

</section>
